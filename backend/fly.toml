# fly.toml app configuration file generated for novaworks-hr-copilot-api on 2026-08-09T08:09:07+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'novaworks-hr-copilot-api'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile.prod'

[env]
  AI_LLM_PROVIDER = 'gemini'
  AI_MODEL_NAME = 'gemini-flash-latest'
  AI_VECTOR_STORE_DIR = '/app/storage/vector-store'
  DATABASE_URL = 'sqlite+aiosqlite:///./storage/hrms.db'
  EMPLOYEE_DOCUMENT_UPLOAD_DIR = '/app/storage/employee-documents'
  POLICY_UPLOAD_DIR = '/app/storage/hr-policies'
  PROFILE_PHOTO_UPLOAD_DIR = '/app/storage/profile-photos'
  PYTHONPATH = '/app'

[[mounts]]
  source = 'novaworks_hr_data'
  destination = '/app/storage'

[[services]]
  protocol = 'tcp'
  internal_port = 8000
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ['http']

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [[services.http_checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'get'
    path = '/health'
    protocol = 'http'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
